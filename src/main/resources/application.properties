spring.application.name=nulsf

# Primary MySQL Configuration (will be used if MySQL is running)
spring.datasource.url=jdbc:mysql://localhost:3306/nulsf
spring.datasource.username=root
spring.datasource.password=admin

# JPA / Hibernate auto table update
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=true

# File upload for item images
app.upload.dir=./uploads
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=12MB

# Server Port
server.port=8081
server.address=0.0.0.0

# Security passcode for Admin registration
app.admin.passcode=NU-ADMIN-2026

# H2 Console (available at /h2-console if needed)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
